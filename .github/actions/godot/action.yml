name: Set up Godot
description: Optionally pulls Git LFS assets, downloads Godot and imports the project, so scripts, autoloads and uid:// paths resolve

inputs:
  assets:
    description: >-
      'true' pulls the Git LFS assets and imports them (tests that load real meshes and textures);
      'false' leaves the asset folders out, which only needs scripts and small resources and imports in a few minutes
    default: 'false'
  import-timeout:
    description: Time limit of the import; the first import of all assets is slow, later runs reuse the cached import
    default: 80m

runs:
  using: composite
  steps:
    # Download LFS objects only when they changed since the cached copy
    - name: List LFS objects
      if: inputs.assets == 'true'
      shell: bash
      run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
    - name: Cache LFS objects
      if: inputs.assets == 'true'
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-objects') }}
        restore-keys: lfs-
    - name: Pull LFS objects
      if: inputs.assets == 'true'
      shell: bash
      run: git lfs pull

    - name: Cache Godot
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ env.GODOT_VERSION }}

    - name: Download Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q godot.zip -d ~/godot
        mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
        rm godot.zip

    - shell: bash
      run: echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"

    # Without a Blender path, Godot asks how to import .blend files and holds back the whole import until answered,
    # which nobody does headless: no import, no uid cache, and every uid:// path fails. CI only; the editor keeps it on.
    - name: Configure import
      shell: bash
      run: |
        printf '\n[filesystem]\n\nimport/blender/enabled=false\n' >> project.godot
        if [ "${{ inputs.assets }}" != "true" ]; then touch assets/.gdignore protoype_assets/.gdignore; fi
        # The full icon set (thousands of SVGs) is only a source for tools/icons/
        touch tools/game_icons/.gdignore

    # Godot reimports only what changed since the cached import, so an older cache still helps
    - name: Cache import
      uses: actions/cache@v4
      with:
        path: .godot
        key: import-${{ inputs.assets == 'true' && 'assets' || 'scripts' }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
        restore-keys: import-${{ inputs.assets == 'true' && 'assets' || 'scripts' }}-${{ env.GODOT_VERSION }}-

    # A fresh checkout has no class or uid cache, so autoloads and uid:// paths do not resolve until imported once.
    # Errors here are assets that can not be imported (e.g. .blend, LFS stubs), so they are not checked; the caches are.
    - name: Import
      shell: bash
      run: |
        timeout ${{ inputs.import-timeout }} "$GODOT_BIN" --headless --path . --import > import.log 2>&1 || true
        grep -a -E "Started|DONE" import.log | sort | uniq -c || true
        test -f .godot/uid_cache.bin || { echo "Import did not finish: no uid cache"; tail -50 import.log; exit 1; }
