name: Set up Godot
description: Downloads Godot, restores the import cache and imports the project, so scripts and autoloads resolve

inputs:
  cache-name:
    description: Import cache name; jobs with and without Git LFS assets import different files
    required: true
  skip-assets:
    description: Leave the asset folders out of the import, for jobs without Git LFS assets (they only hold LFS stubs then)
    default: 'false'
  import-timeout:
    description: Time limit of the import
    default: 20m

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-${{ env.GODOT_VERSION }}

    - name: Download Godot
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        unzip -q godot.zip -d ~/godot
        mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
        rm godot.zip

    - shell: bash
      run: echo "GODOT_BIN=$HOME/godot/godot" >> "$GITHUB_ENV"

    # Without a Blender path, Godot asks how to import .blend files and holds back the whole import until answered,
    # which nobody does headless: no import, no uid cache, and every uid:// path fails. CI only; the editor keeps it on.
    - name: Configure import
      shell: bash
      run: |
        printf '\n[filesystem]\n\nimport/blender/enabled=false\n' >> project.godot
        if [ "${{ inputs.skip-assets }}" = "true" ]; then touch assets/.gdignore protoype_assets/.gdignore; fi

    # Godot reimports only what changed since the cached import, so an older cache still helps
    - name: Cache import
      uses: actions/cache@v4
      with:
        path: .godot
        key: import-${{ inputs.cache-name }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
        restore-keys: import-${{ inputs.cache-name }}-${{ env.GODOT_VERSION }}-

    # A fresh checkout has no class or uid cache, so autoloads and uid:// paths do not resolve until imported once.
    # Errors here are assets that can not be imported (e.g. .blend), so they are not checked; the caches are.
    - name: Import
      shell: bash
      run: |
        timeout ${{ inputs.import-timeout }} "$GODOT_BIN" --headless --path . --import > import.log 2>&1 || true
        grep -a -E "Started|DONE" import.log | sort | uniq -c || true
        test -f .godot/uid_cache.bin || { echo "Import did not finish: no uid cache"; tail -50 import.log; exit 1; }
