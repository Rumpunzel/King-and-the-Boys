name: Asset check

# Runs the main scene with the real Git LFS assets. Tests do not need assets (tests/fixtures), so this only checks
# that scenes and resources load; it is slower (LFS download and import, cached), so only on pull requests into main
# or started by hand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress
concurrency:
  group: asset-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with config/features in project.godot
  GODOT_VERSION: '4.6'

jobs:
  smoke:
    name: Main scene with assets
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/godot
        with:
          assets: 'true'
      # Loads the autoloads and the main scene
      - name: Smoke run
        run: |
          "$GODOT_BIN" --headless --path . --quit-after 300 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Compile Error" smoke.log; then exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: asset-check-logs
          path: |
            smoke.log
            import.log
