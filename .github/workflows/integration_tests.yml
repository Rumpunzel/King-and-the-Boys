name: Integration tests

# Tests on a real generated level with the real meshes (Git LFS). Slower and heavier on LFS bandwidth,
# so only on pull requests into main or started by hand; LFS objects and the import are cached between runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress
concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with config/features in project.godot
  GODOT_VERSION: '4.6'

jobs:
  gdunit:
    name: gdUnit4 (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Download LFS objects only when they changed since the cached copy
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-
      - name: Pull LFS objects
        run: git lfs pull

      - uses: ./.github/actions/godot
        with:
          cache-name: lfs
      - name: Run integration tests
        run: |
          "$GODOT_BIN" --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests/integration 2>&1 | tee tests.log
          # Failing tests fail the pipe (bash runs with pipefail); gdUnit exits with 0 when it finds no tests at all,
          # e.g. because a test script does not compile
          if grep -q "No test cases found" tests.log; then exit 1; fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: reports/
